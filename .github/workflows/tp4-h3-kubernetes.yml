  infra:
    name: Build K8S infra
    if: startsWith(github.event.head_commit.message, '(a)')
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Ckeckout
        uses: actions/checkout@v4

      - name: Google Cloud authentication
        uses: google-github-actions/auth@v2
        with:
          project_id: "project-c0ccded1-22c1-4a9e-85f"
          workload_identity_provider: "projects/571458284813/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-tf@project-c0ccded1-22c1-4a9e-85f.iam.gserviceaccount.com"
          create_credentials_file: true
          export_environment_variables: true

      #Instalo Terraform
      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3

      #Creacion del Cluster
      - name: Terraform init
        working-directory: ./TP4final/H3/Terraform
        run: |
          ls -lah

          terraform init --reconfigure

          terraform validate

          terraform plan -lock=false

          terraform apply -lock=false --auto-approve

  deploy-apps:
    name: Despliegue de servicios y aplicaciones
    needs: infra
    if: startsWith(github.event.head_commit.message, '(a)')
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Conf GCloud
      - name: Google Cloud authentication
        uses: google-github-actions/auth@v2
        with:
          project_id: "project-c0ccded1-22c1-4a9e-85f"
          workload_identity_provider: "projects/571458284813/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-tf@project-c0ccded1-22c1-4a9e-85f.iam.gserviceaccount.com"
          create_credentials_file: true
          export_environment_variables: true

      - name: Google Cloud kubectl plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 363.0.0"
          install_components: "kubectl"

      - name: GCloud Kubectl credentials
        run: |
          REGION="us-east4-b"
          gcloud info
          gcloud components list
          gcloud container clusters get-credentials primary --region=${REGION}

      - name: Deploy y Services app
        working-directory: ./TP4final/H3/K8s
        run: |
          kubectl apply -f joiner-services.yaml
          kubectl apply -f rabbit-services.yaml
          kubectl apply -f redis-services.yaml
          kubectl apply -f spliter-services.yaml
          kubectl apply -f webserver-services.yaml

  infra-down:
    name: Eliminar K8s Infra
    if: startsWith(github.event.head_commit.message, '(a)')
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Ckeckout
        uses: actions/checkout@v4

      - name: Google Cloud authentication
        uses: google-github-actions/auth@v2
        with:
          project_id: "project-c0ccded1-22c1-4a9e-85f"
          workload_identity_provider: "projects/571458284813/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-tf@project-c0ccded1-22c1-4a9e-85f.iam.gserviceaccount.com"
          create_credentials_file: true
          export_environment_variables: true

      #Instalo Terraform
      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3

      #Creacion del Cluster
      - name: Terraform init
        working-directory: ./TP4final/H3/Terraform
        run: |
          ls -lah

          terraform init --reconfigure

          terraform plan

          terraform destroy -lock=false --auto-approve
