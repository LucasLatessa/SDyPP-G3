apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-ha-config
data:
  discover-master.sh: |
    #!/bin/sh
    # Obtener una direccion de maestro respaldada por la mayoria de los
    # Sentinels accesibles que pueden completar el quorum de failover.
    discover_master() {
      DOMAIN="$1"
      while :; do
        IPS="$(nslookup redis-sentinel.default.svc.cluster.local \
          2>/dev/null | awk '$1 == "Name:" { getline; if ($1 == "Address:") print $2 }' \
          | sort -u || true)"
        VOTES="$(mktemp)"

        for IP in $IPS; do
          QUORUM="$(redis-cli -h "$IP" -p 26379 --raw \
            SENTINEL ckquorum mymaster 2>/dev/null || true)"
          case "$QUORUM" in
            OK*) ;;
            *) continue ;;
          esac

          FOUND="$(redis-cli -h "$IP" -p 26379 --raw \
            SENTINEL get-master-addr-by-name mymaster \
            2>/dev/null | head -n 1 || true)"
          case "$FOUND" in
            redis-node-*."$DOMAIN") printf '%s\n' "$FOUND" >> "$VOTES" ;;
          esac
        done

        RESPONSES="$(wc -l < "$VOTES")"
        if [ "$RESPONSES" -ge 2 ]; then
          WINNER="$(sort "$VOTES" | uniq -c | sort -nr | head -n 1)"
          COUNT="$(printf '%s\n' "$WINNER" | awk '{print $1}')"
          MASTER="$(printf '%s\n' "$WINNER" | awk '{print $2}')"
          if [ "$COUNT" -gt "$((RESPONSES / 2))" ]; then
            rm -f "$VOTES"
            printf '%s\n' "$MASTER"
            return 0
          fi
        fi

        rm -f "$VOTES"
        sleep 2
      done
    }

  start-redis.sh: |
    #!/bin/sh
    set -eu

    mkdir -p /data/redis
    DOMAIN="redis-headless.default.svc.cluster.local"
    SELF="$HOSTNAME.$DOMAIN"
    . /config/discover-master.sh

    if [ "${REDIS_BOOTSTRAP:-false}" = "true" ] &&
       [ "$HOSTNAME" = "redis-node-0" ]; then
      MASTER="$SELF"
    else
      while :; do
        MASTER="$(discover_master "$DOMAIN")"
        if [ "$MASTER" = "$SELF" ]; then
          break
        fi
        ROLE="$(REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli \
          -h "$MASTER" --raw ROLE 2>/dev/null | head -n 1 || true)"
        if [ "$ROLE" = "master" ]; then
          break
        fi
        sleep 2
      done
    fi

    set -- redis-server \
      --bind 0.0.0.0 \
      --protected-mode no \
      --appendonly yes \
      --appendfsync everysec \
      --dir /data/redis \
      --requirepass "$REDIS_PASSWORD" \
      --masterauth "$REDIS_PASSWORD" \
      --replica-announce-ip "$SELF" \
      --replica-announce-port 6379 \
      --min-replicas-to-write 1 \
      --min-replicas-max-lag 10

    if [ "$MASTER" != "$SELF" ]; then
      set -- "$@" --replicaof "$MASTER" 6379
    fi

    exec "$@"

  start-sentinel.sh: |
    #!/bin/sh
    set -eu

    mkdir -p /data/sentinel
    DOMAIN="redis-headless.default.svc.cluster.local"
    CONFIG="/data/sentinel/sentinel.conf"
    . /config/discover-master.sh

    if [ ! -f "$CONFIG" ]; then
      if [ "${REDIS_BOOTSTRAP:-false}" = "true" ]; then
        MASTER="redis-node-0.$DOMAIN"
      else
        MASTER="$(discover_master "$DOMAIN")"
      fi

      PASSWORD="$(printf '%s' "$REDIS_PASSWORD" |
        sed 's/\\/\\\\/g; s/"/\\"/g')"

      {
        echo "port 26379"
        echo "bind 0.0.0.0"
        echo "protected-mode no"
        echo "dir /data/sentinel"
        echo "sentinel resolve-hostnames yes"
        echo "sentinel announce-hostnames yes"
        echo "sentinel announce-ip $HOSTNAME.$DOMAIN"
        echo "sentinel announce-port 26379"
        echo "sentinel monitor mymaster $MASTER 6379 2"
        printf 'sentinel auth-pass mymaster "%s"\n' "$PASSWORD"
        echo "sentinel down-after-milliseconds mymaster 5000"
        echo "sentinel failover-timeout mymaster 60000"
        echo "sentinel parallel-syncs mymaster 1"
      } > "$CONFIG"
    fi

    exec redis-server "$CONFIG" --sentinel

  haproxy.cfg: |
    global
        log stdout format raw local0

    resolvers kubernetes
        parse-resolv-conf
        accepted_payload_size 8192
        hold valid 5s

    defaults
        mode tcp
        timeout connect 5s
        timeout client 60s
        timeout server 60s

    frontend redis_frontend
        bind *:6379
        default_backend redis_master

    backend redis_master
        option tcp-check
        tcp-check connect
        tcp-check send "AUTH ${REDIS_PASSWORD}\r\n"
        tcp-check expect string +OK
        tcp-check send "INFO replication\r\n"
        tcp-check expect string role:master

        default-server check resolvers kubernetes init-addr libc,none inter 2s fall 2 rise 1 on-marked-down shutdown-sessions

        server-template redis 1-10 _redis._tcp.redis-headless.default.svc.cluster.local resolvers kubernetes init-addr none check

---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis-ha
  ports:
    - name: redis
      port: 6379
    - name: sentinel
      port: 26379

---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis-ha
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-node
spec:
  serviceName: redis-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redis-ha
  template:
    metadata:
      labels:
        app: redis-ha
    spec:
      nodeSelector:
        role: infra

      # Una pareja Redis/Sentinel en cada nodo.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: redis-ha
              topologyKey: kubernetes.io/hostname

      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["sh", "/config/start-redis.sh"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_BOOTSTRAP
              value: "false"
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -qx PONG'
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data

        - name: sentinel
          image: redis:7.4-alpine
          command: ["sh", "/config/start-sentinel.sh"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_BOOTSTRAP
              value: "false"
          ports:
            - containerPort: 26379
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data

      volumes:
        - name: config
          configMap:
            name: redis-ha-config

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        role: infra
      containers:
        - name: haproxy
          image: haproxy:3.1-alpine
          command:
            - haproxy
            - -W
            - -db
            - -f
            - /config/haproxy.cfg
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: redis-ha-config

---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
